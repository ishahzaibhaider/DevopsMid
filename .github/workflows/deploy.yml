name: ML Pipeline Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dataset/**'
      - 'app.py'
      - 'train.py'
      - 'config.json'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy on EC2 (fetch → train → build → run)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' <<'EOF'
          set -euo pipefail

          REPO_DIR="$HOME/DevopsMid"
          IMAGE="lab-midterm:latest"
          CONTAINER="lab-midterm"

          echo "[1/4] Fetching latest code + data from GitHub..."
          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone https://github.com/ishahzaibhaider/DevopsMid.git "$REPO_DIR"
          fi
          cd "$REPO_DIR"
          git fetch origin main
          git reset --hard origin/main

          echo "[2/4] Building Docker image (train.py runs inside the build)..."
          docker build -t "$IMAGE" .

          echo "[3/4] Restarting container on port 8000..."
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            -p 8000:8000 \
            "$IMAGE"

          echo "[4/4] Health check..."
          sleep 4
          curl -sf http://localhost:8000/metrics | tee /dev/stderr
          echo
          EOF

      - name: Verify external endpoint
        run: |
          sleep 3
          curl -sf "http://${{ secrets.EC2_HOST }}:8000/metrics" | tee metrics.json
          echo
